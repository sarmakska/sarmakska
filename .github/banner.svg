<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="visitor@sarmalinux terminal">
  <defs>
    <!-- Outer cyberpunk gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020210"/>
      <stop offset="35%" stop-color="#0a0a1f"/>
      <stop offset="65%" stop-color="#0d2e4f"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Glow gradient for accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Inner panel gradient (terminal background) -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0a0f1c" stop-opacity="0.86"/>
    </linearGradient>

    <!-- Strong glow filter for prompt text -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.55"/>
      <feComposite in2="blur1" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger neon glow for the cursor -->
    <filter id="cursorGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
      <feFlood flood-color="#34d399" flood-opacity="0.95"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern overlay -->
    <pattern id="scan" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Grid pattern background -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-width="0.4" stroke-opacity="0.16"/>
    </pattern>

    <style>
      .mono {
        font-family: ui-monospace, "JetBrains Mono", "Fira Code", "Geist Mono", "SF Mono", Menlo, monospace;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .user { fill: #34d399; }
      .at   { fill: #64748b; }
      .host { fill: #22d3ee; }
      .colon{ fill: #64748b; }
      .path { fill: #60a5fa; }
      .sigil{ fill: #64748b; }
      .cmd  { fill: #fbbf24; }
      .out  { fill: #e2e8f0; }
      .out-dim { fill: #94a3b8; }
      .out-em { fill: #34d399; font-weight: 800; }
      .out-vi { fill: #a78bfa; font-weight: 800; }
      .out-or { fill: #f97316; font-weight: 800; }

      .tag {
        font-family: ui-monospace, monospace;
        font-weight: 700;
        font-size: 14px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- ===== outer panel ===== -->
  <rect width="1280" height="520" fill="url(#bgGrad)" rx="28"/>

  <!-- Background grid -->
  <rect width="1280" height="520" fill="url(#grid)" rx="28"/>

  <!-- Soft outer glow rings -->
  <circle cx="120" cy="80" r="180" fill="#22d3ee" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1180" cy="440" r="220" fill="#a78bfa" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="640" cy="260" r="280" fill="#34d399" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Inner terminal frame -->
  <rect x="40" y="40" width="1200" height="440" fill="url(#panelGrad)" rx="20" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Title bar -->
  <g transform="translate(40 40)">
    <rect width="1200" height="58" fill="#0a0f1c" rx="20" ry="20"/>
    <rect y="40" width="1200" height="18" fill="#0a0f1c"/>
    <circle cx="38" cy="29" r="9" fill="#ef4444"/>
    <circle cx="68" cy="29" r="9" fill="#fbbf24"/>
    <circle cx="98" cy="29" r="9" fill="#22c55e"/>
    <text x="600" y="36" text-anchor="middle" class="tag" font-size="15" fill="#94a3b8">visitor@sarmalinux  &#x2014;  zsh</text>
    <text x="1160" y="36" text-anchor="end" class="tag" font-size="13" fill="#64748b">sarmalinux.com</text>
  </g>

  <!-- Scanline overlay on the terminal body -->
  <rect x="40" y="100" width="1200" height="380" fill="url(#scan)" opacity="0.6" rx="0"/>

  <!-- ===== Line 1: huge banner prompt ===== -->
  <g transform="translate(76 188)" class="mono">
    <text font-size="56">
      <tspan class="user">visitor</tspan><tspan class="at">@</tspan><tspan class="host" filter="url(#glow)">sarmalinux</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="sigil">$ </tspan>
      <tspan class="cmd">whoami</tspan>
    </text>
  </g>

  <!-- Output line 1 -->
  <g transform="translate(76 232)" class="mono">
    <text font-size="22">
      <tspan class="out-em">senior software engineer</tspan>
      <tspan class="out-dim"> &#xb7; </tspan>
      <tspan class="out-em">19</tspan>
      <tspan class="out"> MIT projects </tspan>
      <tspan class="out-dim">&#xb7;</tspan>
      <tspan class="out"> </tspan>
      <tspan class="out-em">87</tspan>
      <tspan class="out"> long-form essays </tspan>
      <tspan class="out-dim">&#xb7;</tspan>
      <tspan class="out"> </tspan>
      <tspan class="out-em">UK PAYE only</tspan>
    </text>
  </g>

  <!-- ===== Line 2: ls flagships ===== -->
  <g transform="translate(76 304)" class="mono">
    <text font-size="34">
      <tspan class="user">visitor</tspan><tspan class="at">@</tspan><tspan class="host">sarmalinux</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="sigil">$ </tspan>
      <tspan class="cmd">ls flagships/</tspan>
    </text>
  </g>

  <!-- Output line 2 -->
  <g transform="translate(76 344)" class="mono">
    <text font-size="22">
      <tspan class="out-em">slipstream@v1.0</tspan>
      <tspan class="out-dim">   </tspan>
      <tspan class="out-or">sarmalink-ai@36x7</tspan>
      <tspan class="out-dim">   </tspan>
      <tspan class="out-vi">echo@coming-1-jul-2026</tspan>
    </text>
  </g>

  <!-- ===== Line 3: pulsing cursor ===== -->
  <g transform="translate(76 426)" class="mono">
    <text font-size="34">
      <tspan class="user">visitor</tspan><tspan class="at">@</tspan><tspan class="host">sarmalinux</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="sigil">$ </tspan>
    </text>
  </g>

  <!-- Cursor block, big + pulsing + glowing -->
  <rect x="424" y="402" width="22" height="36" fill="#34d399" filter="url(#cursorGlow)">
    <animate attributeName="opacity" values="1;1;0.1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated underline accent at the bottom -->
  <rect x="40" y="478" width="1200" height="2" fill="url(#accentGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle tagline strip at the very bottom -->
  <g transform="translate(640 502)">
    <text text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#64748b" letter-spacing="2px">
      OPEN SOURCE STUDIO &#xb7; UK &#xb7; MIT &#xb7; sarmalinux.com
    </text>
  </g>
</svg>
